# Docker Compose Production - Con Docker Secrets
# Uso: docker stack deploy -c docker-compose.prod.yml local-rag
# Requiere: docker swarm init

version: '3.8'

services:
  rag-api:
    image: gatoco/local-rag:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_db:/app/chroma_db
      - models:/app/models
      - logs:/app/logs
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - JWT_ACCESS_TOKEN_MINUTES=60
      - LLAMA_CPP_MODEL_PATH=/app/models/TinyLlama-1.1B-Q4_K_M.gguf
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - CHROMA_DB_PATH=/app/chroma_db
      - TOP_K_DOCUMENTS=4
      - N_CTX=4096
      - N_GPU_LAYERS=0
      # Secrets reference (from docker secret create)
      - JWT_SECRET_KEY_FILE=/run/secrets/jwt_secret_key
      - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - USER_PASSWORD_FILE=/run/secrets/user_password
      # API keys from env (set via CI/CD or secret store)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
    secrets:
      - jwt_secret_key
      - admin_password
      - user_password
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rag-network

  rag-ui:
    image: gatoco/local-rag:latest
    ports:
      - "8501:8501"
    volumes:
      - ./ui:/app/ui
      - logs:/app/logs
    environment:
      - API_URL=http://rag-api:8000/api/v1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_DEFAULT_PASSWORD_FILE=/run/secrets/admin_password
    command: ["python", "-m", "streamlit", "run", "ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    depends_on:
      - rag-api
    networks:
      - rag-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass-file /run/secrets/redis_password
    secrets:
      - redis_password
    networks:
      - rag-network

secrets:
  jwt_secret_key:
    external: true
  admin_password:
    external: true
  user_password:
    external: true
  redis_password:
    external: true

networks:
  rag-network:
    driver: overlay
    attachable: true

volumes:
  chroma_db:
  models:
  logs:
  redis_data:

# Docker Compose para Sistema RAG Local
# Uso: docker-compose up -d
# Stop: docker-compose down

version: '3.8'

services:
  # API REST
  rag-api:
    build: .
    container_name: rag-api
    ports:
      - "8000:8000"
    volumes:
      # Datos persistentes
      - ./chroma_db:/app/chroma_db
      - ./models:/app/models
      - ./logs:/app/logs
      - ./prompts:/app/prompts
    environment:
      # Configuración de la API
      - API_HOST=0.0.0.0
      - API_PORT=8000
      
      # Seguridad
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-cambia-esto-en-produccion}
      - JWT_ACCESS_TOKEN_MINUTES=60
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - USER_PASSWORD=${USER_PASSWORD:-user123}
      
      # Configuración RAG
      - LLAMA_CPP_MODEL_PATH=/app/models/mistral-7b-instruct-v0.3.Q4_K_M.gguf
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - CHROMA_DB_PATH=/app/chroma_db
      - TOP_K_DOCUMENTS=4
      - N_CTX=4096
      - N_GPU_LAYERS=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rag-network

  # UI Web (Streamlit)
  rag-ui:
    build: .
    container_name: rag-ui
    ports:
      - "8501:8501"
    volumes:
      - ./ui:/app/ui
      - ./logs:/app/logs
    environment:
      # URL de la API
      - API_URL=http://rag-api:8000/api/v1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    command: ["python", "run_ui.py"]
    restart: unless-stopped
    depends_on:
      rag-api:
        condition: service_healthy
    networks:
      - rag-network

  # Redis (caché distribuida - opcional)
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - rag-network

  # Backup automático
  backup:
    image: alpine:latest
    container_name: rag-backup
    volumes:
      - ./chroma_db:/source/chroma_db
      - ./backups:/backup
    environment:
      - BACKUP_INTERVAL=3600  # 1 hora
    command: >
      sh -c '
      while true; do
        TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
        tar -czf /backup/chroma_db_$$TIMESTAMP.tar.gz -C /source chroma_db
        echo "Backup completado: $$TIMESTAMP"
        
        # Eliminar backups antiguos (mantener últimos 10)
        cd /backup && ls -t chroma_db_*.tar.gz | tail -n +11 | xargs -r rm
        sleep $$BACKUP_INTERVAL
      done
      '
    restart: unless-stopped
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  redis_data:

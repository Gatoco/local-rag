[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag"
version = "1.0.0"
description = "Sistema RAG local con Ollama, ChromaDB, Hugging Face y LangChain"
authors = [{name = "Proyecto RAG Local"}]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

keywords = ["rag", "ollama", "chromadb", "langchain", "embeddings", "llm"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "langchain>=0.3.28,<2.0.0",
    "langchain-ollama>=0.3.10",
    "langchain-huggingface>=0.0.43",
    "chromadb>=1.5.5",
    "ollama>=0.2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "colorama>=0.4.6",
    "langchain-community>=0.3.31",
    "llama-cpp-python",
    "textual>=8.2.7",
]

[project.scripts]
mylocalrag = "src.infrastructure.entrypoints.repl.repl:run_repl"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/iwakura/local-rag"
Repository = "https://github.com/iwakura/local-rag"
Documentation = "https://github.com/iwakura/local-rag/tree/main/docs"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 99
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

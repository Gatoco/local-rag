<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG UI - Local AI</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>RAG UI</h1>
      <p class="subtitle">Sistema de Retrieval-Augmented Generation local</p>
    </header>

    <div class="config-panel">
      <div class="config-row">
        <label for="provider-select">Provider:</label>
        <select id="provider-select">
          <option value="">Cargando...</option>
        </select>
      </div>

      <div class="config-row">
        <label for="model-select">Modelo:</label>
        <select id="model-select">
          <option value="">Seleccionar modelo...</option>
        </select>
      </div>

      <div class="config-row" id="api-key-row">
        <label for="api-key">API Key:</label>
        <input type="password" id="api-key" placeholder="sk-... (opcional si está en .env)">
      </div>
    </div>

    <div class="query-panel">
      <textarea id="question" placeholder="Escribe tu pregunta aquí..." rows="3"></textarea>
      <button id="send-btn" onclick="sendQuery()">Enviar Consulta</button>
    </div>

    <div id="result" class="result-panel">
      <p class="placeholder">Los resultados aparecerán aquí...</p>
    </div>
  </div>

  <script src="src/renderer.js"></script>
</body>
</html>
